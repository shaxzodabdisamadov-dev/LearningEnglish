<!DOCTYPE html>
<html lang="uz">
<head>

<title>Level — WordPath</title>
<link rel="stylesheet" href="css/style.css" />

<body data-page="level">

      <a class="brand" href="index.html"><span class="dot"></span> WordPath</a>

        </div>
        <button class="btn" id="levelTestBtn" disabled>Testni boshlash</button>

    </div>
  </div>

  <script src="js/app.js"></script>
